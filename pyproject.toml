[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evidensia-ai"
version = "0.1.0"
description = "Autonomous research and evidence intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "langgraph>=1.0,<2",
  "mem0ai>=2.0.14,<3",
  "pydantic>=2.10,<3",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
]

[project.scripts]
evidensia-api = "evidensia.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/evidensia"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
