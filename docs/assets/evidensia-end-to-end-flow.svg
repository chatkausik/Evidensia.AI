<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">Evidensia end-to-end autonomous research flow</title>
  <desc id="flow-desc">A five-stage flow from research questions and scholarly sources through ingestion, corrective retrieval, evidence synthesis and verification, to cited reports, exports, saved searches, and evaluations.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF8EF"/>
      <stop offset="1" stop-color="#E9F1E8"/>
    </linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B342E"/>
      <stop offset="1" stop-color="#165247"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6FF8A"/>
      <stop offset="1" stop-color="#C8F45A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173B34" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1B5B4F"/>
    </marker>
    <marker id="arrow-lime" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#B8E843"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 2.4px; fill: #4E6F66; }
      .title { font-size: 38px; font-weight: 800; letter-spacing: -1.2px; fill: #102E29; }
      .subtitle { font-size: 17px; fill: #55736B; }
      .phase { font-size: 14px; font-weight: 800; letter-spacing: 1.8px; fill: #5D756E; }
      .phase-number { font-size: 13px; font-weight: 900; fill: #123B33; }
      .panel-title { font-size: 22px; font-weight: 800; fill: #102E29; }
      .panel-title-light { font-size: 22px; font-weight: 800; fill: #FFFFFF; }
      .node-title { font-size: 16px; font-weight: 800; fill: #163C34; }
      .node-title-light { font-size: 16px; font-weight: 800; fill: #FFFFFF; }
      .body { font-size: 14px; fill: #516C65; }
      .body-light { font-size: 14px; fill: #D8E8E3; }
      .tiny { font-size: 12px; font-weight: 700; fill: #315C52; }
      .chip { font-size: 12px; font-weight: 800; fill: #123B33; }
      .output { font-size: 14px; font-weight: 800; fill: #163C34; }
      .arrow { fill: none; stroke: #1B5B4F; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #B8E843; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; marker-end: url(#arrow-lime); }
    </style>
  </defs>

  <rect width="1800" height="1050" fill="url(#paper)"/>
  <circle cx="1680" cy="62" r="180" fill="#DDF3D5" opacity="0.55"/>
  <circle cx="90" cy="1010" r="230" fill="#E6FF8A" opacity="0.16"/>

  <text x="55" y="58" class="eyebrow">EVIDENSIA · AUTONOMOUS EVIDENCE INTELLIGENCE</text>
  <text x="55" y="105" class="title">From an open question to a defensible, citation-verified answer</text>
  <text x="55" y="137" class="subtitle">The full discovery, ingestion, corrective-retrieval, reasoning, verification, and learning loop.</text>

  <!-- Phase 1: inputs -->
  <g filter="url(#shadow)">
    <rect x="50" y="190" width="260" height="525" rx="26" fill="#FFFFFF" stroke="#D8E5DD" stroke-width="2"/>
  </g>
  <rect x="70" y="168" width="40" height="40" rx="13" fill="url(#lime)"/>
  <text x="90" y="194" class="phase-number" text-anchor="middle">01</text>
  <text x="122" y="192" class="phase">ASK + ACQUIRE</text>
  <text x="75" y="238" class="panel-title">Research inputs</text>

  <rect x="75" y="270" width="210" height="112" rx="18" fill="#F3F7F2" stroke="#CFE0D5"/>
  <text x="94" y="300" class="node-title">Question &amp; scope</text>
  <text x="94" y="326" class="body">Research depth, date range,</text>
  <text x="94" y="347" class="body">collection, and constraints</text>
  <rect x="94" y="358" width="88" height="5" rx="2.5" fill="#C8F45A"/>

  <text x="180" y="413" class="tiny" text-anchor="middle">PLUS TRUSTED SOURCES</text>
  <rect x="75" y="432" width="210" height="98" rx="18" fill="#0E3C34"/>
  <text x="94" y="462" class="node-title-light">Live paper discovery</text>
  <text x="94" y="488" class="body-light">arXiv · OpenAlex</text>
  <text x="94" y="509" class="body-light">Semantic Scholar · Crossref</text>

  <rect x="75" y="548" width="210" height="78" rx="18" fill="#E8F8F2" stroke="#B8DDD0"/>
  <text x="94" y="579" class="node-title">Direct uploads</text>
  <text x="94" y="605" class="body">PDF · Markdown · HTML · text</text>

  <rect x="75" y="644" width="210" height="46" rx="14" fill="#FFF5E8" stroke="#F0D8B8"/>
  <text x="180" y="673" class="tiny" text-anchor="middle">OPEN-ACCESS RESOLUTION</text>

  <!-- Phase 2: corpus -->
  <g filter="url(#shadow)">
    <rect x="360" y="190" width="290" height="525" rx="26" fill="#FFFFFF" stroke="#D8E5DD" stroke-width="2"/>
  </g>
  <rect x="380" y="168" width="40" height="40" rx="13" fill="#BDEADF"/>
  <text x="400" y="194" class="phase-number" text-anchor="middle">02</text>
  <text x="432" y="192" class="phase">INGEST + ORGANIZE</text>
  <text x="385" y="238" class="panel-title">Evidence corpus</text>

  <rect x="385" y="270" width="240" height="76" rx="17" fill="#F3F7F2" stroke="#CFE0D5"/>
  <text x="407" y="301" class="node-title">Resolve &amp; deduplicate</text>
  <text x="407" y="325" class="body">DOI · title · author · provenance</text>
  <path d="M505 346 V365" class="arrow"/>

  <rect x="385" y="371" width="240" height="76" rx="17" fill="#F3F7F2" stroke="#CFE0D5"/>
  <text x="407" y="402" class="node-title">Parse &amp; extract</text>
  <text x="407" y="426" class="body">Clean text · sections · metadata</text>
  <path d="M505 447 V466" class="arrow"/>

  <rect x="385" y="472" width="240" height="76" rx="17" fill="#F3F7F2" stroke="#CFE0D5"/>
  <text x="407" y="503" class="node-title">Hierarchical chunking</text>
  <text x="407" y="527" class="body">Parent context + retrieval spans</text>
  <path d="M505 548 V567" class="arrow"/>

  <rect x="385" y="573" width="240" height="96" rx="17" fill="#0E3C34"/>
  <text x="407" y="604" class="node-title-light">Build searchable index</text>
  <text x="407" y="630" class="body-light">Dense vectors + BM25 terms</text>
  <text x="407" y="651" class="body-light">filters + exact source spans</text>

  <!-- Phase 3: agent -->
  <g filter="url(#shadow)">
    <rect x="700" y="190" width="410" height="525" rx="26" fill="url(#forest)"/>
  </g>
  <rect x="720" y="168" width="40" height="40" rx="13" fill="url(#lime)"/>
  <text x="740" y="194" class="phase-number" text-anchor="middle">03</text>
  <text x="772" y="192" class="phase">PLAN + RETRIEVE + CORRECT</text>
  <text x="730" y="238" class="panel-title-light">Corrective research agent</text>

  <rect x="730" y="270" width="350" height="72" rx="18" fill="#184F45" stroke="#39766B"/>
  <circle cx="760" cy="306" r="15" fill="#D7FF66"/>
  <text x="760" y="311" class="phase-number" text-anchor="middle">1</text>
  <text x="788" y="301" class="node-title-light">Plan the investigation</text>
  <text x="788" y="323" class="body-light">Sub-questions + counter-evidence targets</text>
  <path d="M905 342 V366" class="arrow" style="stroke:#B8E843;marker-end:url(#arrow-lime)"/>

  <rect x="730" y="372" width="350" height="86" rx="18" fill="#184F45" stroke="#39766B"/>
  <circle cx="760" cy="415" r="15" fill="#BDEADF"/>
  <text x="760" y="420" class="phase-number" text-anchor="middle">2</text>
  <text x="788" y="403" class="node-title-light">Hybrid retrieval</text>
  <text x="788" y="426" class="body-light">Dense + BM25 → reciprocal-rank fusion</text>
  <text x="788" y="447" class="body-light">→ transparent reranking</text>
  <path d="M905 458 V482" class="arrow" style="stroke:#B8E843;marker-end:url(#arrow-lime)"/>

  <rect x="730" y="488" width="350" height="82" rx="18" fill="#184F45" stroke="#39766B"/>
  <circle cx="760" cy="529" r="15" fill="#FFD3B6"/>
  <text x="760" y="534" class="phase-number" text-anchor="middle">3</text>
  <text x="788" y="517" class="node-title-light">Assess sufficiency</text>
  <text x="788" y="540" class="body-light">Coverage · diversity · contradiction</text>
  <text x="788" y="559" class="body-light">coverage · depth budget</text>

  <rect x="750" y="608" width="210" height="64" rx="18" fill="#FFF5E8"/>
  <text x="855" y="636" class="tiny" text-anchor="middle">INSUFFICIENT?</text>
  <text x="855" y="657" class="body" text-anchor="middle">Rewrite &amp; retrieve again</text>
  <path d="M750 640 H706 V415 H724" class="feedback"/>
  <text x="978" y="647" class="chip" style="fill:#D7FF66">SUFFICIENT →</text>

  <!-- Phase 4: evidence intelligence -->
  <g filter="url(#shadow)">
    <rect x="1160" y="190" width="310" height="525" rx="26" fill="#FFFFFF" stroke="#D8E5DD" stroke-width="2"/>
  </g>
  <rect x="1180" y="168" width="40" height="40" rx="13" fill="#FFD3B6"/>
  <text x="1200" y="194" class="phase-number" text-anchor="middle">04</text>
  <text x="1232" y="192" class="phase">SYNTHESIZE + PROVE</text>
  <text x="1185" y="238" class="panel-title">Evidence intelligence</text>

  <rect x="1185" y="270" width="260" height="84" rx="18" fill="#E8F8F2" stroke="#B8DDD0"/>
  <text x="1207" y="301" class="node-title">Evidence packets</text>
  <text x="1207" y="326" class="body">Supporting + contradicting spans</text>
  <text x="1207" y="346" class="body">with document provenance</text>
  <path d="M1315 354 V378" class="arrow"/>

  <rect x="1185" y="384" width="260" height="96" rx="18" fill="#FFF5E8" stroke="#F0D8B8"/>
  <text x="1207" y="415" class="node-title">Evidence-aware synthesis</text>
  <text x="1207" y="440" class="body">OpenAI Responses API</text>
  <text x="1207" y="461" class="body">or deterministic fallback</text>
  <path d="M1315 480 V504" class="arrow"/>

  <rect x="1185" y="510" width="260" height="122" rx="18" fill="#0E3C34"/>
  <text x="1207" y="542" class="node-title-light">Claim verification gate</text>
  <text x="1207" y="570" class="body-light">✓ Citation resolves to a chunk</text>
  <text x="1207" y="594" class="body-light">✓ Source entails the claim</text>
  <text x="1207" y="618" class="body-light">✓ Confidence is calibrated</text>
  <rect x="1210" y="650" width="210" height="34" rx="12" fill="url(#lime)"/>
  <text x="1315" y="672" class="chip" text-anchor="middle">ONLY VERIFIED CLAIMS PASS</text>

  <!-- Phase 5: outputs -->
  <g filter="url(#shadow)">
    <rect x="1520" y="190" width="230" height="525" rx="26" fill="#FFFFFF" stroke="#D8E5DD" stroke-width="2"/>
  </g>
  <rect x="1540" y="168" width="40" height="40" rx="13" fill="url(#lime)"/>
  <text x="1560" y="194" class="phase-number" text-anchor="middle">05</text>
  <text x="1592" y="192" class="phase">DELIVER + LEARN</text>
  <text x="1545" y="238" class="panel-title">Defensible output</text>

  <rect x="1545" y="270" width="180" height="82" rx="18" fill="#0E3C34"/>
  <text x="1565" y="302" class="node-title-light">Verified report</text>
  <text x="1565" y="327" class="body-light">Claims · citations</text>
  <text x="1565" y="347" class="body-light">limits · confidence</text>

  <rect x="1545" y="370" width="180" height="74" rx="18" fill="#E8F8F2" stroke="#B8DDD0"/>
  <text x="1565" y="400" class="output">Evidence explorer</text>
  <text x="1565" y="424" class="body">Live SSE timeline</text>

  <rect x="1545" y="462" width="180" height="74" rx="18" fill="#F3F7F2" stroke="#CFE0D5"/>
  <text x="1565" y="492" class="output">Export</text>
  <text x="1565" y="516" class="body">MD · JSON · BibTeX · RIS</text>

  <rect x="1545" y="554" width="180" height="108" rx="18" fill="#FFF5E8" stroke="#F0D8B8"/>
  <text x="1565" y="585" class="output">Continuous learning</text>
  <text x="1565" y="610" class="body">Saved searches</text>
  <text x="1565" y="631" class="body">Collections · feedback</text>
  <text x="1565" y="652" class="body">Retrieval evaluations</text>

  <!-- Major-flow arrows -->
  <path d="M310 452 H350" class="arrow"/>
  <path d="M650 452 H690" class="arrow"/>
  <path d="M1110 452 H1150" class="arrow"/>
  <path d="M1470 452 H1510" class="arrow"/>

  <!-- Cross-cutting foundation -->
  <g filter="url(#shadow)">
    <rect x="50" y="785" width="1700" height="185" rx="28" fill="#102E29"/>
  </g>
  <text x="80" y="825" class="eyebrow" style="fill:#BDEADF">CROSS-CUTTING FOUNDATION</text>
  <line x1="625" y1="838" x2="625" y2="938" stroke="#3A655D" stroke-width="2"/>
  <line x1="1190" y1="838" x2="1190" y2="938" stroke="#3A655D" stroke-width="2"/>

  <text x="80" y="864" class="node-title-light">Durable research state</text>
  <text x="80" y="891" class="body-light">Documents · chunks · runs · events · experiments</text>
  <text x="80" y="916" class="body-light">saved searches · collections · feedback</text>
  <rect x="80" y="934" width="142" height="5" rx="2.5" fill="#D7FF66"/>

  <text x="660" y="864" class="node-title-light">Replaceable provider seams</text>
  <text x="660" y="891" class="body-light">Hashed embeddings · lexical reranker · entailment baseline</text>
  <text x="660" y="916" class="body-light">Remote embedding/reranking/entailment + OpenAI reasoning</text>
  <rect x="660" y="934" width="142" height="5" rx="2.5" fill="#BDEADF"/>

  <text x="1225" y="864" class="node-title-light">Auditability &amp; evaluation</text>
  <text x="1225" y="891" class="body-light">Exact source spans · retrieval debugger · citation graph</text>
  <text x="1225" y="916" class="body-light">Recall@K · MRR · NDCG · claim coverage · ablations</text>
  <rect x="1225" y="934" width="142" height="5" rx="2.5" fill="#FFD3B6"/>

  <text x="1750" y="1017" class="tiny" text-anchor="end">PHASES 5 + 7 INFRASTRUCTURE REMAIN DEFERRED</text>
</svg>
